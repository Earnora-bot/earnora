<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090c">
  <title>Earnora</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header><div class="logo">⚡ EARNORA</div><span class="online">● ONLINE</span></header>
    <section class="balance"><p>TOTAL BALANCE</p><h1 id="balance">$0.00</h1><small id="welcome">Your earning dashboard</small></section>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home" aria-label="Home"><span class="nav-icon">⌂</span><span>HOME</span></button>
      <button class="nav-item" data-page="tasks" aria-label="Tasks"><span class="nav-icon">☷</span><span>TASK</span></button>
      <button class="nav-item" data-page="ads" aria-label="Watch ads"><span class="nav-icon">▶</span><span>WATCH AD</span></button>
      <button class="nav-item" data-page="referral" aria-label="Referral"><span class="nav-icon">♧</span><span>REFER</span></button>
      <button class="nav-item" data-page="profile" aria-label="Profile"><span class="nav-icon">◎</span><span>PROFILE</span></button>
    </nav>
    <section id="content" aria-live="polite"><h2>Welcome to Earnora</h2><p>Complete eligible activities to earn rewards.</p></section>
    <footer>Earnora • Earn Smart</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
